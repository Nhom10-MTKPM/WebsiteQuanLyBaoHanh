<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - TechCare Pro | Hệ Thống Quản Lý Bảo Hành & Hỗ Trợ Kỹ Thuật PC & Laptop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-logo">
            <span class="logo-icon">💻🔧</span>
            <h1>TechCare Pro</h1>
            <p>Hệ thống Quản lý Bảo hành & Kỹ thuật PC - Laptop</p>
        </div>

        <form id="loginForm" class="auth-form" onsubmit="handleLoginSubmit(event)">
            <div class="form-group">
                <label for="loginEmail"><i class="fas fa-envelope"></i> Email đăng nhập</label>
                <input type="email" id="loginEmail" placeholder="Nhập email của bạn (vd: email@gmail.com)" required autocomplete="email">
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label for="loginPassword" style="margin-bottom:0;"><i class="fas fa-lock"></i> Mật khẩu</label>
                    <a href="forgot-password.html" style="font-size: 0.8rem; color: var(--accent-dark); text-decoration: none;">Quên mật khẩu?</a>
                </div>
                <input type="password" id="loginPassword" placeholder="Nhập mật khẩu của bạn" required autocomplete="current-password">
            </div>

            <button type="submit" id="btnLogin" class="btn-primary">
                <i class="fas fa-sign-in-alt"></i> Đăng nhập hệ thống
            </button>
        </form>

        <div class="auth-links">
            <p>Bạn là khách hàng mới? <a href="register.html"><strong>Đăng ký tài khoản ngay</strong></a></p>
        </div>

        <div class="auth-divider">
            <span>Dành cho Khách vãng lai</span>
        </div>

        <div class="guest-actions">
            <a href="tracking.html" class="btn-outline">
                <i class="fas fa-search"></i> Tra cứu tiến độ (Ticket)
            </a>
            <a href="services.html" class="btn-outline">
                <i class="fas fa-list-alt"></i> Bảng giá & Dịch vụ
            </a>
        </div>
    </div>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <!-- App Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>

    <script>
        async function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('btnLogin');

            if (!email || !password) {
                showToast('Vui lòng nhập đầy đủ email và mật khẩu!', 'warning');
                return;
            }

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xác thực...';
                await loginUser(email, password);
                // Redirection is handled inside loginUser based on Firestore user role
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Đăng nhập hệ thống';
                showToast(err.message, 'error');
            }
        }

        // Auto check if already logged in, redirect appropriately to role landing page
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const doc = await db.collection('users').doc(user.uid).get();
                    if (doc.exists) {
                        const role = doc.data().role || 'khachhang';
                        sessionStorage.setItem('techcare_user', JSON.stringify({ ...doc.data(), uid: user.uid }));
                        window.location.href = getHomeUrlForRole(role, false);
                    }
                } catch(e) {
                    console.log('Session check:', e);
                }
            }
        });
    </script>
</body>
</html>
